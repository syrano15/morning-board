<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>모닝 브리핑</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #0A0E13;
      --card-bg: rgba(19, 25, 33, 0.86);
      --row-line: rgba(255, 255, 255, 0.07);
      --border: #263140;
      --text-main: #EEF2F7;
      --text-sub: #AAB5C3;
      --text-muted: #8895A6;
      --accent: #8B5CF6;
      --accent-soft: rgba(139, 92, 246, 0.16);
      --success-text: #4CC26A;
      --warning-bg: rgba(210, 153, 34, 0.16);
      --warning-text: #E2B341;
      --danger-bg: rgba(248, 81, 73, 0.16);
      --danger-text: #FF7B72;
      --blue-bg: rgba(56, 139, 253, 0.16);
      --blue-text: #6CB2FF;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    html {
      min-height: 100%;
      background:
        radial-gradient(820px 520px at 8% -10%, rgba(139, 92, 246, 0.24), transparent 62%),
        radial-gradient(720px 480px at 100% 6%, rgba(56, 139, 253, 0.13), transparent 60%),
        radial-gradient(800px 600px at 50% 115%, rgba(45, 212, 191, 0.07), transparent 60%),
        linear-gradient(180deg, #0D1219 0%, #090C11 100%);
    }
    body {
      min-height: 100vh; color: var(--text-main); padding: 28px 16px 60px; display: flex; justify-content: center; line-height: 1.5;
      background: transparent;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 0%, transparent 75%);
              mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 0%, transparent 75%);
    }
    .container { position: relative; z-index: 1; width: 100%; max-width: 740px; display: flex; flex-direction: column; gap: 16px; }
    .num { font-variant-numeric: tabular-nums; }

    header { background: linear-gradient(135deg, rgba(139,92,246,0.14), rgba(19,25,33,0.86) 55%); border: 1px solid #343B57; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(10px); }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { font-size: 14.5px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }
    .badge-live { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: #CFC2FF; font-size: 12.5px; font-weight: 700; padding: 5px 11px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.38); }
    .badge-live::before { content: ""; width: 6px; height: 6px; background: #A78BFA; border-radius: 50%; }
    .weather-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--text-sub); }
    .weather-strip > span { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); padding: 7px 12px; border-radius: 10px; }
    .weather-strip strong { color: var(--text-main); font-weight: 700; }

    .section-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(10px); }
    .section-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--row-line); gap: 8px; }
    .section-title { font-size: 16.5px; font-weight: 800; letter-spacing: -0.2px; }
    .section-meta { font-size: 12px; font-weight: 600; color: var(--text-sub); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); padding: 2px 9px; border-radius: 999px; }

    .item-list { display: flex; flex-direction: column; }
    .list-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 13px 2px; border-bottom: 1px solid var(--row-line); }
    .list-item:last-child { border-bottom: none; }
    .item-content { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .item-title { font-size: 15.5px; font-weight: 700; color: var(--text-main); }
    .item-desc { font-size: 13.5px; color: var(--text-sub); }
    .empty { font-size: 14px; color: var(--text-muted); padding: 12px 2px; }

    .tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; height: fit-content; border: 1px solid transparent; margin-top: 1px; }
    .tag-done { background: rgba(46,160,67,0.16); color: var(--success-text); border-color: rgba(46,160,67,0.35); }
    .tag-todo { background: rgba(136,149,166,0.14); color: #C3CCD8; border-color: rgba(136,149,166,0.32); }
    .tag-due { background: var(--danger-bg); color: var(--danger-text); border-color: rgba(248,81,73,0.35); }
    .tag-info { background: var(--blue-bg); color: var(--blue-text); border-color: rgba(56,139,253,0.35); }
    .tag-unused { background: var(--warning-bg); color: var(--warning-text); border-color: rgba(210,153,34,0.38); }

    .bluray-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding: 8px 0 12px; }
    .bluray-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 13px 14px; display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; }
    a.bluray-card { transition: border-color 150ms ease, transform 120ms var(--ease-out); }
    a.bluray-card:active { transform: scale(0.98); }
    @media (hover: hover) and (pointer: fine) { a.bluray-card:hover { border-color: rgba(255,255,255,0.2); } }
    .bluray-tag { font-size: 11px; font-weight: 800; color: #5CC8FF; letter-spacing: 0.6px; }
    .bluray-title { font-size: 14px; font-weight: 700; line-height: 1.45; }
    .bluray-meta { font-size: 12px; color: var(--text-muted); margin-top: auto; }

    .alert { background: var(--warning-bg); border: 1px solid rgba(210,153,34,0.4); color: #EBC255; border-radius: 12px; padding: 12px 14px; font-size: 13px; }
    .alert.error { background: var(--danger-bg); border-color: rgba(248,81,73,0.4); color: #FF8F87; }
    .alert ul { margin: 6px 0 0 16px; }

    footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); gap: 8px; flex-wrap: wrap; padding: 4px 4px 0; }
    .link-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }

    .setup { max-width: 420px; width: 100%; margin: 12vh auto 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .setup h2 { font-size: 17px; }
    .setup p { font-size: 13px; color: var(--text-sub); }
    .setup input { width: 100%; padding: 10px 12px; background: #0B0F14; color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; font-family: ui-monospace, monospace; }
    .setup input:focus { border-color: var(--accent); }
    .btn { align-self: flex-start; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; background: var(--accent); color: #fff; transition: transform 120ms var(--ease-out); }
    .btn:active { transform: scale(0.97); }
    .loading { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20vh; }

    @media (max-width: 480px) {
      body { padding: 18px 12px 50px; }
      header { padding: 18px; }
      h1 { font-size: 23px; }
      .section-card { padding: 16px 16px 6px; }
      .bluray-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { .btn:active, a.bluray-card:active { transform: none; } }
  </style>
</head>
<body>
  <div class="container" id="app"><div class="loading">불러오는 중…</div></div>

  <script>
  (function () {
    "use strict";
    var KEY = "morning_board_gist_id";
    var STATUS = { done: "완료", todo: "예정", due: "마감 임박", info: "참고", unused: "미사용" };
    var WD = ["일","월","화","수","목","금","토"];
    var app = document.getElementById("app");

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function kst(iso) {
      var d = new Date(iso); if (isNaN(d)) return null;
      var k = new Date(d.getTime() + 9 * 3600 * 1000);
      return { y: k.getUTCFullYear(), m: k.getUTCMonth() + 1, d: k.getUTCDate(), h: k.getUTCHours(), mi: k.getUTCMinutes(), w: k.getUTCDay() };
    }
    function todayStr() { var p = kst(new Date().toISOString()); return p.y + "-" + pad(p.m) + "-" + pad(p.d); }
    function dateLabel(s, long) {
      var a = String(s).split("-").map(Number); if (a.length !== 3) return String(s);
      var w = WD[new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay()];
      return long ? a[0] + "년 " + a[1] + "월 " + a[2] + "일 " + w + "요일" : a[1] + "/" + a[2] + "(" + w + ")";
    }
    function whenLabel(iso) { var p = kst(iso); return p ? p.m + "/" + p.d + "(" + WD[p.w] + ") " + pad(p.h) + ":" + pad(p.mi) : ""; }
    function getId() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
    function setId(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }

    function showSetup(msg) {
      app.innerHTML = "";
      var box = el("div", "setup");
      box.appendChild(el("h2", null, "모닝 브리핑 연결"));
      box.appendChild(el("p", null, "이 기기에서 처음 한 번만 모닝 브리핑 Gist ID를 입력하세요. ID는 이 기기 브라우저에만 저장됩니다."));
      if (msg) box.appendChild(el("div", "alert error", msg));
      var input = el("input"); input.placeholder = "Gist ID"; input.autocomplete = "off"; input.spellcheck = false;
      var btn = el("button", "btn", "연결");
      function go() {
        var v = input.value.trim().replace(/^.*gist\.github\.com\/[^/]+\//, "").replace(/[^0-9a-f]/gi, "");
        if (!v) { input.focus(); return; }
        setId(v); load();
      }
      btn.addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      box.appendChild(input); box.appendChild(btn); app.appendChild(box); input.focus();
    }

    function validate(d) {
      var errs = [];
      if (d.schema !== "morning-board/1") errs.push("schema 값이 morning-board/1이 아닙니다.");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) errs.push("date 형식이 YYYY-MM-DD가 아닙니다.");
      ["quests", "work", "benefits", "bluray"].forEach(function (k) {
        if (!Array.isArray(d[k])) { errs.push(k + " 섹션이 없습니다."); return; }
        if (k === "bluray") return;
        d[k].forEach(function (it) { if (!STATUS[it.status]) errs.push(k + " / " + (it.title || "?") + ": 정해진 status가 아닙니다 (" + it.status + ")."); });
      });
      return errs;
    }

    function load() {
      var id = getId();
      if (!id) { showSetup(); return; }
      app.innerHTML = '<div class="loading">불러오는 중…</div>';
      fetch("https://api.github.com/gists/" + encodeURIComponent(id), { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } })
        .then(function (r) {
          if (r.status === 404) throw new Error("NOTFOUND");
          if (r.status === 403 || r.status === 429) throw new Error("RATE");
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (g) {
          var f = (g.files || {})["latest.json"];
          if (!f) throw new Error("NOFILE");
          var d; try { d = JSON.parse(f.content); } catch (e) { throw new Error("PARSE"); }
          render(d, validate(d));
        })
        .catch(function (e) {
          var m = String(e.message || e);
          if (m === "NOTFOUND") showSetup("이 ID의 Gist를 찾지 못했습니다. ID를 다시 확인해 주세요.");
          else if (m === "RATE") fail("GitHub 조회 한도에 걸렸습니다. 잠시 뒤 새로고침해 주세요.");
          else if (m === "PARSE") fail("latest.json의 JSON 문법이 깨졌습니다. 피클이 마지막에 쓴 내용을 확인해야 합니다.");
          else if (m === "NOFILE") fail("Gist에 latest.json이 없습니다.");
          else fail("불러오지 못했습니다 (" + m + "). 인터넷 연결을 확인하고 새로고침해 주세요.");
        });
    }

    function fail(msg) { app.innerHTML = ""; app.appendChild(el("div", "alert error", msg)); app.appendChild(footer()); }
    function footer() {
      var f = el("footer");
      f.appendChild(el("span", null, "Pickle Assistant · Daily Morning Briefing v1.0"));
      var b = el("button", "link-btn", "Gist 연결 바꾸기");
      b.addEventListener("click", function () { setId(""); showSetup(); });
      f.appendChild(b); return f;
    }

    function section(title, meta) {
      var s = el("section", "section-card");
      var h = el("div", "section-header");
      h.appendChild(el("div", "section-title", title));
      if (meta) h.appendChild(el("div", "section-meta", meta));
      s.appendChild(h); return s;
    }
    function itemList(items, descFn, emptyText) {
      var list = el("div", "item-list");
      if (!items || !items.length) { list.appendChild(el("div", "empty", emptyText)); return list; }
      items.forEach(function (it) {
        var row = el("div", "list-item");
        var c = el("div", "item-content");
        c.appendChild(el("div", "item-title", it.title || ""));
        var desc = descFn(it); if (desc) c.appendChild(el("div", "item-desc", desc));
        row.appendChild(c);
        if (STATUS[it.status]) row.appendChild(el("span", "tag tag-" + it.status, STATUS[it.status]));
        list.appendChild(row);
      });
      return list;
    }

    function render(d, errs) {
      app.innerHTML = "";
      var gen = kst(d.generatedAt);

      var head = el("header");
      var top = el("div", "header-top");
      var tg = el("div");
      tg.appendChild(el("h1", null, "☀️ 모닝 브리핑"));
      tg.appendChild(el("div", "header-sub", dateLabel(d.date, true) + (gen ? " · " + (gen.h < 12 ? "오전 " : "오후 ") + ((gen.h % 12) || 12) + ":" + pad(gen.mi) + " 기준" : "")));
      top.appendChild(tg);
      top.appendChild(el("div", "badge-live", "피클 데일리 루틴"));
      head.appendChild(top);
      if (d.weather) {
        var w = d.weather, ws = el("div", "weather-strip");
        var s1 = el("span"); s1.appendChild(document.createTextNode("📍 " + (w.place || "") + ": ")); s1.appendChild(el("strong", "num", "최저 " + w.min + "°C / 최고 " + w.max + "°C"));
        var s2 = el("span"); s2.appendChild(document.createTextNode("☔ 강수확률 ")); s2.appendChild(el("strong", "num", w.rainChance + "%")); if (w.note) s2.appendChild(document.createTextNode(" (" + w.note + ")"));
        ws.appendChild(s1); ws.appendChild(s2); head.appendChild(ws);
      }
      app.appendChild(head);

      var today = todayStr();
      if (d.date !== today) {
        app.appendChild(el("div", "alert", "오늘 " + dateLabel(today) + " 브리핑이 아직 없습니다. 아래는 " + dateLabel(d.date) + " 브리핑입니다."));
      }
      if (errs.length) {
        var al = el("div", "alert error");
        al.appendChild(el("strong", null, "데이터 형식에 맞지 않는 부분이 있습니다."));
        var ul = el("ul"); errs.slice(0, 8).forEach(function (m) { ul.appendChild(el("li", null, m)); });
        al.appendChild(ul); app.appendChild(al);
      }

      var q = section("📋 오늘의 할 일 (퀘스트보드)", "데이로그");
      q.appendChild(itemList(d.quests, function (it) { return it.desc; }, "오늘 등록된 할 일이 없습니다."));
      app.appendChild(q);

      var wk = (d.work || []).slice().sort(function (a, b) { return new Date(a.when) - new Date(b.when); });
      var ws2 = section("💼 회사 리마인더 & 일정", wk.length ? wk.length + "건" : "");
      ws2.appendChild(itemList(wk, function (it) { return [whenLabel(it.when), it.place, it.desc].filter(Boolean).join(" · "); }, "예정된 회사 일정이 없습니다."));
      app.appendChild(ws2);

      var bn = section("🎁 LG 유플러스 혜택", "");
      bn.appendChild(itemList(d.benefits, function (it) { return it.desc; }, "확인할 혜택이 없습니다."));
      app.appendChild(bn);

      var br = section("🎬 알라딘 4K UHD 블루레이 신작 / 예판", (d.bluray || []).length ? d.bluray.length + "건" : "");
      if (!(d.bluray || []).length) br.appendChild(el("div", "empty", "새로 올라온 타이틀이 없습니다."));
      else {
        var grid = el("div", "bluray-grid");
        d.bluray.forEach(function (b) {
          var card;
          if (b.url && /^https:\/\//.test(b.url)) { card = el("a", "bluray-card"); card.href = b.url; card.target = "_blank"; card.rel = "noopener noreferrer"; }
          else card = el("div", "bluray-card");
          if (b.edition) card.appendChild(el("span", "bluray-tag", b.edition));
          card.appendChild(el("div", "bluray-title", b.title || ""));
          if (b.discs) card.appendChild(el("div", "bluray-meta", b.discs));
          grid.appendChild(card);
        });
        br.appendChild(grid);
      }
      app.appendChild(br);
      app.appendChild(footer());
    }

    load();
  })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
