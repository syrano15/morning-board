<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EDF2F8">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>모닝 브리핑</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #EDF2F8;
      --panel: #FFFFFF;
      --line: #DCE3EC;
      --line-soft: #E9EEF4;
      --text-main: #0F172A;
      --text-sub: #3B4A5E;
      --text-muted: #5B6778;
      --accent: #2563EB;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 26px -16px rgba(15,23,42,.20);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    html {
      min-height: 100%;
      background:
        radial-gradient(900px 500px at 10% -5%, rgba(96,165,250,.20), transparent 60%),
        radial-gradient(760px 480px at 100% 20%, rgba(129,140,248,.12), transparent 60%),
        linear-gradient(180deg, #EEF3F9 0%, #E8EDF5 100%);
    }
    body { min-height: 100vh; color: var(--text-main); padding: 24px 16px 56px; display: flex; justify-content: center; line-height: 1.5; background: transparent; }
    .container { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 14px; }
    .num { font-variant-numeric: tabular-nums; }

    /* 날씨 헤더 */
    header { position: relative; overflow: hidden; border-radius: 22px; min-height: 230px; padding: 24px 26px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; color: #fff; box-shadow: 0 2px 4px rgba(15,23,42,.08), 0 18px 40px -20px rgba(15,23,42,.45); background: #4a6b8f; }
    .sky-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    header::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,15,30,0) 20%, rgba(8,15,30,.45) 100%); pointer-events: none; }
    .header-top, .weather-strip { position: relative; z-index: 1; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
    .header-sub { font-size: 15px; font-weight: 600; margin-top: 4px; color: rgba(255,255,255,.92); text-shadow: 0 1px 6px rgba(0,0,0,.25); }
    .badge-live { display: inline-flex; align-items: center; gap: 6px; background: rgba(15,23,42,.42); color: #fff; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(8px); }
    .badge-live::before { content: ""; width: 6px; height: 6px; background: #A5F3C4; border-radius: 50%; }
    .weather-strip { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
    .weather-strip > span { background: rgba(15,23,42,.38); border: 1px solid rgba(255,255,255,.22); color: rgba(255,255,255,.92); padding: 7px 13px; border-radius: 11px; backdrop-filter: blur(8px); }
    .weather-strip strong { color: #fff; font-weight: 800; }
    /* 강수 패널: 큰 숫자 + 시간대별 칸 + 작은 칩 */
    .rain-panel { position: relative; z-index: 1; background: rgba(15,23,42,.42); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; padding: 12px 14px 12px; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 10px; }
    .rain-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .rain-head .rh-label { font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,.85); }
    .rain-head .rh-big { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #fff; line-height: 1; }
    .rain-head .rh-word { font-size: 14px; font-weight: 700; color: rgba(255,255,255,.92); }
    .rain-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 6px; }
    .rain-slot { background: rgba(255,255,255,.08); border-radius: 10px; padding: 7px 8px 8px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .rain-slot .rs-time { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72); white-space: nowrap; }
    .rain-slot .rs-pct { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.15; }
    .rain-slot .rs-word { font-size: 11.5px; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rain-slot .rs-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 2px; }
    .rain-slot .rs-bar > i { display: block; height: 100%; border-radius: 2px; background: #93C5FD; }
    .rain-slot.hi .rs-bar > i { background: #60A5FA; }
    .wx-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .wx-chip { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.9); background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px 10px; max-width: 100%; }
    .wx-chip.bad { background: #FEE2E2; color: #991B1B; }
    .wx-chip.vbad { background: #991B1B; color: #fff; }
    .rain-note { font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.78); }

    /* 비·눈·구름 움직임 */
    .rain-fall { animation: rainFall 0.9s linear infinite; }
    .rain-fall.slow { animation-duration: 1.4s; }
    .tips { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; }
    .tip { font-size: 13px; font-weight: 700; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.9); color: #1E293B; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .tip-hot { background: #FFEDD5; color: #9A3412; }
    .tip-cold { background: #DBEAFE; color: #1E3A8A; }
    .tip-cool { background: #E0F2FE; color: #075985; }
    .tip-wet { background: #E0E7FF; color: #3730A3; }
    .tip-warn { background: #FEF3C7; color: #92400E; }
    .tip-bad { background: #FEE2E2; color: #991B1B; }
    .tip-ok { background: #DCFCE7; color: #166534; }
    .snow-fall { animation: snowFall 9s linear infinite; }
    .snow-fall.slow { animation-duration: 14s; }
    .drift { animation: drift 40s ease-in-out infinite alternate; }
    @keyframes rainFall { from { transform: translate(0, -60px); } to { transform: translate(-12px, 0); } }
    @keyframes snowFall { from { transform: translate(0, -240px); } to { transform: translate(-30px, 0); } }
    @keyframes drift { from { transform: translateX(-18px); } to { transform: translateX(18px); } }

    /* 섹션 카드 */
    .section-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 22px 6px; box-shadow: var(--shadow); --dot: #64748B; }
    .section-card.s-quests { --dot: #2563EB; }
    .section-card.s-work { --dot: #0D9488; }
    .section-card.s-bluray { --dot: #7C3AED; }
    .section-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); gap: 8px; }
    .section-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
    .section-meta { font-size: 12px; font-weight: 700; color: var(--text-sub); background: #EEF2F7; padding: 3px 10px; border-radius: 999px; }

    .item-list { display: flex; flex-direction: column; }
    .list-item { display: grid; grid-template-columns: 10px minmax(0, 34%) minmax(0, 1fr) auto; align-items: center; column-gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .list-item:last-child { border-bottom: none; }
    .list-item::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
    .item-content { display: contents; }
    .item-title { font-size: 15.5px; font-weight: 700; color: var(--text-main); }
    .item-desc { font-size: 14px; color: var(--text-sub); }
    .list-item .tag { justify-self: end; }
    .empty { font-size: 14px; color: var(--text-muted); padding: 14px 0; }
    @media (max-width: 640px) {
      .list-item { grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-areas: "dot title tag" "dot desc tag"; row-gap: 2px; align-items: start; }
      .list-item::before { grid-area: dot; margin-top: 8px; }
      .item-title { grid-area: title; }
      .item-desc { grid-area: desc; font-size: 13.5px; }
      .list-item .tag { grid-area: tag; align-self: start; margin-top: 1px; }
    }


    /* 할 일: 회사/집 나누기 — 폰은 탭, PC는 두 칸 */
    .bd-tabs { display: flex; gap: 6px; padding: 12px 0 4px; }
    .bd-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 8px; border-radius: 10px; border: 1px solid var(--line); background: #F8FAFC; font-size: 14px; font-weight: 700; color: var(--text-sub); cursor: pointer; transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 120ms var(--ease-out); }
    .bd-tab:active { transform: scale(0.97); }
    .bd-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .bd-tab .n { font-size: 12px; background: #E2E8F0; color: #334155; padding: 0 8px; border-radius: 999px; }
    .bd-tab[aria-selected="true"] { background: #EFF6FF; border-color: #BFDBFE; color: #1D4ED8; }
    .bd-tab[aria-selected="true"] .n { background: #DBEAFE; color: #1D4ED8; }
    .bd-head { display: none; font-size: 14px; font-weight: 800; color: var(--text-sub); padding: 12px 0 2px; }
    .bd-head .n { font-weight: 700; color: var(--text-muted); margin-left: 4px; }
    .bd-panel[hidden] { display: none; }
    .bd-tab:disabled { opacity: .45; cursor: default; }
    .bd-tab:disabled:active { transform: none; }
    .bd-empty { font-size: 14px; color: var(--text-muted); padding: 14px 0; }
    .cat-chip { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; vertical-align: 1px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, #fff); }
    .tag-canceled { background: #F1F5F9; color: #64748B; text-decoration: line-through; }
    .tag-deferred { background: #EEF2FF; color: #4338CA; }
    .dl-note { font-size: 12.5px; color: var(--text-muted); padding: 10px 0 2px; }
    .bd-panel .list-item { grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-areas: "dot title tag" "dot desc tag"; row-gap: 2px; align-items: start; }
    .bd-panel .list-item::before { grid-area: dot; margin-top: 8px; }
    .bd-panel .item-title { grid-area: title; }
    .bd-panel .item-desc { grid-area: desc; }
    .bd-panel .list-item .tag { grid-area: tag; align-self: start; margin-top: 1px; }
    .bd-panel[data-b="work"] .list-item::before { background: #2563EB; }
    .bd-panel[data-b="home"] .list-item::before { background: #16A34A; }
    @media (min-width: 900px) {
      .bd-tabs { display: none; }
      .bd-head { display: block; }
      .bd-panels { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
      .bd-panel, .bd-panel[hidden] { display: block; }
      .bd-panel + .bd-panel { border-left: 1px solid var(--line-soft); padding-left: 28px; }
    }
    @media (prefers-reduced-motion: reduce) { .bd-tab:active { transform: none; } }
    .tag { font-size: 12px; font-weight: 700; padding: 3px 11px; border-radius: 999px; white-space: nowrap; height: fit-content; }
    .tag-done { background: #DCFCE7; color: #15803D; }
    .tag-todo { background: #EEF2F7; color: #475569; }
    .tag-due { background: #FEE2E2; color: #B91C1C; }
    .tag-info { background: #E0F2FE; color: #0369A1; }
    .tag-unused { background: #FEF3C7; color: #A16207; }

    .bluray-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; padding: 14px 0 16px; }
    .bluray-card { display: flex; gap: 14px; align-items: stretch; background: #F8FAFC; border: 1px solid var(--line); border-radius: 14px; padding: 12px; color: inherit; text-decoration: none; min-height: 110px; }
    a.bluray-card { transition: border-color 150ms ease, transform 120ms var(--ease-out); }
    a.bluray-card:active { transform: scale(0.98); }
    @media (hover: hover) and (pointer: fine) { a.bluray-card:hover { border-color: #A5B4CB; } }
    .bluray-cover { flex: none; width: 66px; aspect-ratio: 5 / 6.4; border-radius: 6px; object-fit: cover; background: #E2E8F0; box-shadow: 0 2px 6px rgba(15,23,42,.18); }
    .bluray-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .bluray-tag { font-size: 11px; font-weight: 800; color: #0E7490; letter-spacing: 0.6px; }
    .bluray-title { font-size: 14px; font-weight: 700; line-height: 1.45; }
    .bluray-meta { font-size: 12.5px; color: var(--text-muted); margin-top: auto; }

    /* 레이더 캐러셀 */
    .section-card.s-radar { --dot: #7C3AED; }
    .radar-empty { word-break: keep-all; }
    .radar-wrap { position: relative; padding: 14px 0 6px; }
    .radar-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
    .radar-track::-webkit-scrollbar { display: none; }
    .radar-card { --tc: #64748B; --tb: #F1F5F9; flex: 0 0 calc((100% - 24px) / 3); scroll-snap-align: start; display: flex; gap: 12px; align-items: stretch; height: 132px; box-sizing: border-box; background: #F8FAFC; border: 1px solid var(--line); border-radius: 14px; padding: 10px; color: inherit; text-decoration: none; min-width: 0; }
    .radar-card.t-tumblbug { --tc: #EA580C; --tb: #FFEDD5; }
    .radar-card.t-bluray { --tc: #7C3AED; --tb: #EDE9FE; }
    .radar-card.t-movie { --tc: #E11D48; --tb: #FFE4E6; }
    .radar-card.t-game { --tc: #0D9488; --tb: #CCFBF1; }
    a.radar-card { transition: border-color 150ms ease, transform 120ms var(--ease-out); }
    a.radar-card:active { transform: scale(0.98); }
    @media (hover: hover) and (pointer: fine) { a.radar-card:hover { border-color: #A5B4CB; } }
    .radar-thumb { flex: none; width: 74px; height: 100%; border-radius: 8px; object-fit: cover; background: var(--tb); box-shadow: 0 2px 6px rgba(15,23,42,.14); }
    .radar-ph { flex: none; width: 74px; height: 100%; border-radius: 8px; background: var(--tb); display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .radar-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .radar-badge { align-self: flex-start; font-size: 11.5px; font-weight: 800; color: var(--tc); background: var(--tb); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .radar-title { font-size: 14px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
    .radar-desc { font-size: 12.5px; line-height: 1.4; color: var(--text-muted); margin-top: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
    .radar-nav { position: absolute; top: calc(14px + 66px); transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sub); font-size: 16px; transition: opacity 150ms ease, transform 120ms var(--ease-out); }
    .radar-nav:active { transform: translateY(-50%) scale(0.94); }
    .radar-nav.prev { left: -12px; } .radar-nav.next { right: -12px; }
    .radar-nav[disabled] { opacity: 0; pointer-events: none; }
    .radar-wrap.scrollable .radar-nav { display: flex; }
    .radar-dots { display: none; justify-content: center; gap: 6px; padding: 10px 0 4px; }
    .radar-wrap.scrollable .radar-dots { display: flex; }
    .radar-dot { width: 6px; height: 6px; border-radius: 999px; background: #CBD5E1; transition: width 200ms var(--ease-out), background-color 200ms ease; }
    .radar-dot.on { width: 16px; background: #64748B; }
    @media (max-width: 900px) { .radar-card { flex-basis: calc((100% - 12px) / 2); } }
    @media (max-width: 640px) { .radar-card { flex-basis: 86%; } .radar-nav { display: none !important; } }

    .alert { background: #FFF7E6; border: 1px solid #F5C26B; color: #7A4100; border-radius: 12px; padding: 12px 14px; font-size: 13px; }
    .alert.error { background: #FEF2F2; border-color: #FCA5A5; color: #B91C1C; }
    .alert ul { margin: 6px 0 0 16px; }

    footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); gap: 8px; flex-wrap: wrap; padding: 4px 4px 0; }
    .link-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }

    .setup { max-width: 420px; width: 100%; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
    .setup h2 { font-size: 17px; }
    .setup p { font-size: 13px; color: var(--text-sub); }
    .setup input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; font-family: ui-monospace, monospace; }
    .setup input:focus { border-color: var(--accent); }
    .btn { align-self: flex-start; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; background: var(--accent); color: #fff; transition: transform 120ms var(--ease-out); }
    .btn:active { transform: scale(0.97); }
    .loading { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20vh; }

    @media (max-width: 480px) {
      body { padding: 14px 12px 50px; }
      header { padding: 18px; min-height: 200px; border-radius: 18px; }
      h1 { font-size: 24px; }
      .section-card { padding: 14px 16px 4px; }
      .bluray-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rain-fall, .snow-fall, .drift { animation: none; }
      .btn:active, a.bluray-card:active, a.radar-card:active, .radar-nav:active { transform: none; }
      .radar-dot { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container" id="app"><div class="loading">불러오는 중…</div></div>

  <script>
  (function () {
    "use strict";
    var KEY = "morning_board_gist_id";
    var STATUS = { done: "완료", todo: "예정", due: "마감 임박", info: "참고", unused: "미사용" };
    var DL_STATUS = { canceled: "취소", deferred: "미룸" };
    var WD = ["일","월","화","수","목","금","토"];
    var app = document.getElementById("app");
    var TOKEN_EXPIRES = "2027-11-06";   /* 피클이 Gist에 쓰는 GitHub 토큰 만료일 */
    var TOKEN_WARN_DAYS = 30;
    function tokenWarning() {
      var t = new Date(Date.now() + 9 * 3600 * 1000);
      var today = Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate());
      var a = TOKEN_EXPIRES.split("-").map(Number);
      var left = Math.round((Date.UTC(a[0], a[1] - 1, a[2]) - today) / 864e5);
      if (left > TOKEN_WARN_DAYS) return null;
      var box = document.createElement("div");
      box.className = "alert error token-alert";
      box.setAttribute("role", "alert");
      box.textContent = left > 0
        ? "⚠️ 피클의 GitHub 토큰 만료가 " + left + "일 남았습니다 (" + TOKEN_EXPIRES + "). 만료되면 피클이 데이터를 갱신하지 못합니다. 클로드에게 문의하세요!"
        : "⚠️ 피클의 GitHub 토큰이 만료됐습니다 (" + TOKEN_EXPIRES + "). 지금 화면은 마지막으로 저장된 데이터입니다. 클로드에게 문의하세요!";
      return box;
    }

    var SKY = { clear: 1, partly: 1, cloudy: 1, rain: 1, snow: 1 };
    function skyOf(w) {
      if (w && SKY[w.sky]) return w.sky;
      var n = String((w && w.note) || "");
      if (/눈/.test(n)) return "snow";
      if (/비|소나기/.test(n)) return "rain";
      if (/흐림|흐리/.test(n)) return "cloudy";
      if (/구름/.test(n)) return "partly";
      if (w && Number(w.rainChance) >= 60) return "rain";
      return "clear";
    }
    var PAL = {

      }
      prev.addEventListener("click", function () { track.scrollBy({ left: -step(), behavior: "smooth" }); });
      next.addEventListener("click", function () { track.scrollBy({ left: step(), behavior: "smooth" }); });
      var raf = 0; track.addEventListener("scroll", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); }, { passive: true });
      window.addEventListener("resize", update);
      wrap.appendChild(track); wrap.appendChild(prev); wrap.appendChild(next); wrap.appendChild(dots);
      sec.appendChild(wrap);
      requestAnimationFrame(update);
      return sec;
    }

    function load() {
      var id = getId();
      if (!id) { showSetup(); return; }
      app.innerHTML = '<div class="loading">불러오는 중…</div>';
      fetch("https://api.github.com/gists/" + encodeURIComponent(id), { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } })
        .then(function (r) {
          if (r.status === 404) throw new Error("NOTFOUND");
          if (r.status === 403 || r.status === 429) throw new Error("RATE");
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (g) {
          var f = (g.files || {})["latest.json"];
          if (!f) throw new Error("NOFILE");
          var d; try { d = JSON.parse(f.content); } catch (e) { throw new Error("PARSE"); }
          var cfg = {}; try { cfg = JSON.parse(((g.files || {})["config.json"] || {}).content || "{}"); } catch (e) { cfg = {}; }
          if (!cfg.daylogGistId) { render(d, validate(d), { err: "데이로그 연결 정보가 없어 피클이 저장한 할 일을 보여 줍니다." }); return; }
          return fetch("https://api.github.com/gists/" + encodeURIComponent(cfg.daylogGistId), { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } })
            .then(function (r) { if (!r.ok) throw new Error("DL " + r.status); return r.json(); })
            .then(function (dl) {
              var big = Object.keys(dl.files || {}).filter(function (n) { return dl.files[n].truncated; });
              if (!big.length) return dl;
              return Promise.all(big.map(function (n) { return fetch(dl.files[n].raw_url).then(function (r) { return r.text(); }).then(function (t) { dl.files[n].content = t; }); })).then(function () { return dl; });
            })
            .then(function (dl) { render(d, validate(d), { ok: true, items: daylogToday(dl) }); })
            .catch(function () { render(d, validate(d), { err: "데이로그를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요." }); });
        })
        .catch(function (e) {
          var m = String(e.message || e);
          if (m === "NOTFOUND") showSetup("이 ID의 Gist를 찾지 못했습니다. ID를 다시 확인해 주세요.");
          else if (m === "RATE") fail("GitHub 조회 한도에 걸렸습니다. 잠시 뒤 새로고침해 주세요.");
          else if (m === "PARSE") fail("latest.json의 JSON 문법이 깨졌습니다. 피클이 마지막에 쓴 내용을 확인해야 합니다.");
          else if (m === "NOFILE") fail("Gist에 latest.json이 없습니다.");
          else fail("불러오지 못했습니다 (" + m + "). 인터넷 연결을 확인하고 새로고침해 주세요.");
        });
    }

    function fail(msg) { app.innerHTML = ""; app.appendChild(el("div", "alert error", msg)); app.appendChild(footer()); }
    function footer() {
      var f = el("footer");
      f.appendChild(el("span", null, "Pickle Assistant · Daily Morning Briefing v1.0"));
      var b = el("button", "link-btn", "Gist 연결 바꾸기");
      b.addEventListener("click", function () { setId(""); showSetup(); });
      f.appendChild(b); return f;
    }

    function section(title, meta, key) {
      var s = el("section", "section-card" + (key ? " s-" + key : ""));
      var h = el("div", "section-header");
      h.appendChild(el("div", "section-title", title));
      if (meta) h.appendChild(el("div", "section-meta", meta));
      s.appendChild(h); return s;
    }
    function itemList(items, descFn, emptyText) {
      var list = el("div", "item-list");
      if (!items || !items.length) { list.appendChild(el("div", "empty", emptyText)); return list; }
      items.forEach(function (it) {
        var row = el("div", "list-item");
        var c = el("div", "item-content");
        var tt = el("div", "item-title", it.title || "");
        if (it.cat && it.cat.name) { var cc = el("span", "cat-chip", it.cat.name); cc.style.setProperty("--c", it.cat.color || "#64748B"); tt.appendChild(cc); }
        c.appendChild(tt);
        var desc = descFn(it); if (desc) c.appendChild(el("div", "item-desc", desc));
        row.appendChild(c);
        var lab = STATUS[it.status] || DL_STATUS[it.status];
        if (lab) row.appendChild(el("span", "tag tag-" + it.status, lab));
        list.appendChild(row);
      });
      return list;
    }

    /* ---- 데이로그에서 오늘 할 일을 직접 읽기 ----
       브리핑 Gist의 config.json 에 데이로그 Gist ID가 있다. 데이로그 Gist는 읽기만 한다. */
    function daylogToday(dl) {
      var key = todayStr();
      function read(name, board) {
        var f = dl.files && dl.files[name];
        if (!f || !f.content) return [];
        var d; try { d = JSON.parse(f.content); } catch (e) { return []; }
        var cats = {}; (d.cats || []).forEach(function (c) { cats[c.id] = c; });
        var tomb = d.tomb || {};
        var list = ((d.days || {})[key] || []).filter(function (it) {
          if (!it || !it.id) return false;
          var t = tomb[it.id];
          return !(t && (t.at || 0) >= (it.at || 0));
        });
        list.sort(function (a, b) {
          if (!!a.done !== !!b.done) return a.done ? 1 : -1;
          return (a.ord || 0) - (b.ord || 0);
        });
        return list.map(function (it) {
          var c = cats[it.cat];
          return {
            title: it.text || "",
            desc: it.note || "",
            status: it.done ? "done" : it.canceled ? "canceled" : it.defer ? "deferred" : "todo",
            board: board,
            cat: c ? { name: c.name, color: c.color } : null
          };
        });
      }
      return read("work.json", "work").concat(read("home.json", "home"));
    }

    function questBlock(items, note) {
      items = items || [];
      var work = items.filter(function (q) { return q.board === "work"; });
      var home = items.filter(function (q) { return q.board === "home"; });
      var other = items.filter(function (q) { return q.board !== "work" && q.board !== "home"; });
      var wrap = el("div", "bd-wrap");
      if (other.length) {
        wrap.appendChild(itemList(items, function (it) { return it.desc; }, "오늘 등록된 할 일이 없습니다."));
        if (note) wrap.appendChild(el("div", "dl-note", note));
        return wrap;
      }
      var a = String(todayStr()).split("-").map(Number);
      var wd = new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay();
      var sel = (wd === 0 || wd === 6) ? "home" : "work";
      if (sel === "work" && !work.length && home.length) sel = "home";
      if (sel === "home" && !home.length && work.length) sel = "work";
      var tabs = el("div", "bd-tabs"); tabs.setAttribute("role", "tablist");
      var panels = el("div", "bd-panels");
      var defs = [{ k: "work", label: "회사", list: work }, { k: "home", label: "집", list: home }];
      var btns = {}, pans = {};
      defs.forEach(function (d) {
        var b = el("button", "bd-tab"); b.type = "button"; b.setAttribute("role", "tab");
        b.appendChild(document.createTextNode(d.label)); b.appendChild(el("span", "n num", String(d.list.length)));
        if (!d.list.length) b.disabled = true;
        b.addEventListener("click", function () { pick(d.k); });
        tabs.appendChild(b); btns[d.k] = b;
        var pn = el("div", "bd-panel"); pn.setAttribute("data-b", d.k); pn.setAttribute("role", "tabpanel");
        var hd = el("div", "bd-head"); hd.appendChild(document.createTextNode(d.label)); hd.appendChild(el("span", "n num", d.list.length + "건"));
        pn.appendChild(hd);
        if (d.list.length) pn.appendChild(itemList(d.list, function (it) { return it.desc; }, ""));
        else pn.appendChild(el("div", "bd-empty", "오늘 " + d.label + " 할 일이 없습니다."));
        panels.appendChild(pn); pans[d.k] = pn;
      });
      function pick(k) {
        defs.forEach(function (d) { var on = d.k === k; btns[d.k].setAttribute("aria-selected", on ? "true" : "false"); pans[d.k].hidden = !on; });
      }
      pick(sel);
      wrap.appendChild(tabs); wrap.appendChild(panels);
      if (note) wrap.appendChild(el("div", "dl-note", note));
      return wrap;
    }

    function render(d, errs, dl) {
      app.innerHTML = "";
      var gen = kst(d.generatedAt);

      var head = el("header");
      head.className = "sky-" + skyOf(d.weather);
      head.insertAdjacentHTML("afterbegin", sceneSVG(skyOf(d.weather)));
      var top = el("div", "header-top");
      var tg = el("div");
      tg.appendChild(el("h1", null, "☀️ 모닝 브리핑"));
      tg.appendChild(el("div", "header-sub", dateLabel(d.date, true) + (gen ? " · " + (gen.h < 12 ? "오전 " : "오후 ") + ((gen.h % 12) || 12) + ":" + pad(gen.mi) + " 기준" : "")));
      top.appendChild(tg);
      top.appendChild(el("div", "badge-live", "피클 데일리 루틴"));
      head.appendChild(top);
      if (d.weather) {
        var w = d.weather, ws = el("div", "weather-strip");
        var s1 = el("span"); s1.appendChild(document.createTextNode("📍 " + (w.place || "") + ": ")); s1.appendChild(el("strong", "num", "최저 " + w.min + "°C / 최고 " + w.max + "°C"));
        ws.appendChild(s1); head.appendChild(ws);
        head.appendChild(rainPanel(w));
        var tips = weatherTips(w, isDayOff(d));
        if (tips.length) {
          var tr = el("div", "tips");
          tips.forEach(function (x) { tr.appendChild(el("span", "tip tip-" + x.k, x.t)); });
          head.appendChild(tr);
        }
      }
      app.appendChild(head);

      var tw = tokenWarning(); if (tw) app.appendChild(tw);

      var today = todayStr();
      if (d.date !== today) {
        app.appendChild(el("div", "alert", "오늘 " + dateLabel(today) + " 브리핑이 아직 없습니다. 아래는 " + dateLabel(d.date) + " 브리핑입니다."));
      }
      if (errs.length) {
        var al = el("div", "alert error");
        al.appendChild(el("strong", null, "데이터 형식에 맞지 않는 부분이 있습니다."));
        var ul = el("ul"); errs.slice(0, 8).forEach(function (m) { ul.appendChild(el("li", null, m)); });
        al.appendChild(ul); app.appendChild(al);
      }

      var q = section("📋 오늘의 할 일 (퀘스트보드)", "데이로그", "quests");
      var qItems = d.quests || [], qNote = "";
      if (dl && dl.ok) { qItems = dl.items; qNote = "데이로그에서 실시간으로 불러옴"; }
      else if (dl && dl.err) { qNote = dl.err; }
      q.appendChild(questBlock(qItems, qNote));
      app.appendChild(q);

      var wk = (d.work || []).slice().sort(function (a, b) { return new Date(a.when) - new Date(b.when); });
      var ws2 = section("💼 회사 리마인더 & 일정", wk.length ? wk.length + "건" : "", "work");
      ws2.appendChild(itemList(wk, function (it) { return [whenLabel(it.when), it.place, it.desc].filter(Boolean).join(" · "); }, "예정된 회사 일정이 없습니다."));
      app.appendChild(ws2);

      if (Array.isArray(d.radar)) app.appendChild(radarBlock(d.radar));
      else {
        var br = section("🎬 알라딘 4K UHD 블루레이 신작 / 예판", (d.bluray || []).length ? d.bluray.length + "건" : "", "bluray");
        if (!(d.bluray || []).length) br.appendChild(el("div", "empty", "새로 올라온 타이틀이 없습니다."));
        else {
          var grid = el("div", "bluray-grid");
          d.bluray.forEach(function (b) {
            var card;
            if (b.url && /^https:\/\//.test(b.url)) { card = el("a", "bluray-card"); card.href = b.url; card.target = "_blank"; card.rel = "noopener noreferrer"; }
            else card = el("div", "bluray-card");
            if (b.image && /^https:\/\//.test(b.image)) {
              var img = el("img", "bluray-cover"); img.alt = ""; img.decoding = "async"; img.referrerPolicy = "no-referrer";
              img.addEventListener("error", function () { img.remove(); });
              img.src = b.image; card.appendChild(img);
            }
            var bt = el("div", "bluray-text");
            if (b.edition) bt.appendChild(el("span", "bluray-tag", b.edition));
            bt.appendChild(el("div", "bluray-title", b.title || ""));
            if (b.discs) bt.appendChild(el("div", "bluray-meta", b.discs));
            card.appendChild(bt);
            grid.appendChild(card);
          });
          br.appendChild(grid);
        }
        app.appendChild(br);
      }
      app.appendChild(footer());
    }

    load();
  })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
